<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Amanah Familia Solution — Tanya AI Kami</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    color: #1a1a1a;
    background: #f2f4f0;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    height: 85vh;
    overflow: hidden;
  }
  header {
    background: #0F2247;
    color: #fff;
    padding: 16px 20px;
    font-weight: 600;
  }
  header small { display: block; font-weight: 400; opacity: .85; font-size: 12px; margin-top: 2px; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #FBF0D0; border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: #f0f0f0; border-bottom-left-radius: 4px; }
  .agent.pending { color: #888; font-style: italic; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #eee;
  }
  input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
    color: #1a1a1a;
    background: #fff;
  }
  button {
    background: #0F2247;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      Amanah Familia Solution
      <small>Asisten AI — Perawatan Properti Jabodetabek</small>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Tulis pesan..." />
      <button type="submit">Kirim</button>
    </form>
  </div>

<script>
  // crypto.randomUUID() only works in secure contexts (https or localhost) —
  // accessing this page via a LAN IP over plain http needs a fallback.
  function makeId() {
    if (window.crypto?.randomUUID) return crypto.randomUUID();
    return "sess-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
  }

  const sessionId = localStorage.getItem("halo_session") ?? makeId();
  localStorage.setItem("halo_session", sessionId);

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function renderMarkdownLite(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g, "<em>$1</em>");
  }

  function addBubble(text, who) {
    const el = document.createElement("div");
    el.className = "bubble " + who;
    el.innerHTML = renderMarkdownLite(text);
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    addBubble(message, "user");

    const pending = addBubble("mengetik...", "agent pending");
    form.querySelector("button").disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message }),
      });
      const data = await res.json();
      pending.innerHTML = renderMarkdownLite(data.reply ?? "(tidak ada balasan)");
      pending.classList.remove("pending");
    } catch (err) {
      pending.textContent = "Error: gagal menghubungi server.";
      pending.classList.remove("pending");
    } finally {
      form.querySelector("button").disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
